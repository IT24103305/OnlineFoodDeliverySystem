<!-- order_summary.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Summary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      padding: 30px;
    }

    .summary-container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #007BFF;
      color: white;
    }

    .total-row {
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="summary-container">
  <h2>Order Summary</h2>
  <table>
    <tr>
      <th>Item</th>
      <th>Quantity</th>
      <th>Price ($)</th>
      <th>Total</th>
    </tr>
    <tr>
      <td>Pizza</td>
      <td>2</td>
      <td>8.00</td>
      <td>16.00</td>
    </tr>
    <tr>
      <td>Burger</td>
      <td>1</td>
      <td>5.00</td>
      <td>5.00</td>
    </tr>
    <tr class="total-row">
      <td colspan="3">Total</td>
      <td>$21.00</td>
    </tr>
  </table>
</div>

</body>
</html>
