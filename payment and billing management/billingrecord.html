<!-- billing_records.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing Records</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      padding: 30px;
    }

    .billing-container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #343a40;
      color: white;
    }
  </style>
</head>
<body>

<div class="billing-container">
  <h2>Billing Records</h2>
  <table>
    <tr>
      <th>Customer</th>
      <th>Date</th>
      <th>Amount ($)</th>
      <th>Status</th>
    </tr>
    <tr>
      <td>John Doe</td>
      <td>2025-05-08</td>
      <td>21.00</td>
      <td>Paid</td>
    </tr>
    <tr>
      <td>Jane Smith</td>
      <td>2025-05-07</td>
      <td>13.00</td>
      <td>Paid</td>
    </tr>
  </table>
</div>

</body>
</html>
